services:
  postgres:
    image: postgres:17
    container_name: dukankhata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dukankhata
      POSTGRES_USER: dukankhata
      POSTGRES_PASSWORD: dukankhata
    ports:
      - "5432:5432"
    volumes:
      - dukankhata_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dukankhata-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dukankhata_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  dukankhata_pgdata:
  dukankhata_redisdata:
